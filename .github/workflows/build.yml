name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller PyQt6-Tools
    
    - name: Generate UI resources
      run: |
        python scripts/convert_svg_to_ico.py
        pyrcc6 resources/icons/icons.qrc -o resources/icons/icons_rc.py
    
    - name: Build with PyInstaller
      run: |
        pyinstaller spider_manager.spec --clean
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: spider-manager-windows
        path: dist/
        retention-days: 30
    
    - name: Create installer with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
    
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: spider-manager-installer
        path: "*.exe"
        retention-days: 30
