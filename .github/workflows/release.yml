name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller PyQt6-Tools
    
    - name: Generate UI resources
      run: |
        python scripts/convert_svg_to_ico.py
        pyrcc6 resources/icons/icons.qrc -o resources/icons/icons_rc.py
    
    - name: Build with PyInstaller
      run: |
        pyinstaller spider_manager.spec --clean
    
    - name: Create installer with NSIS
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
    
    - name: Extract version from tag
      id: get_version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $env:GITHUB_OUTPUT
      shell: pwsh
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.exe
          dist/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
