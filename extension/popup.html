<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 380px;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #c9d1d9;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      border-bottom: 2px solid #3fb950;
    }
    
    .header-icon {
      width: 32px;
      height: 32px;
      margin-right: 12px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    
    .header-text h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      color: #ffffff;
    }
    
    .header-text p {
      font-size: 11px;
      margin: 2px 0 0 0;
      color: rgba(255,255,255,0.8);
    }
    
    .section {
      padding: 16px;
      border-bottom: 1px solid #30363d;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .section-header h2 {
      font-size: 12px;
      margin: 0;
      color: #8b949e;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .section-count {
      background: #30363d;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #8b949e;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      padding: 10px 12px;
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button.secondary {
      background: #21262d;
      color: #c9d1d9;
    }
    
    button.secondary:hover {
      background: #30363d;
    }
    
    .media-list {
      max-height: 280px;
      overflow-y: auto;
    }
    
    .media-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .media-list::-webkit-scrollbar-track {
      background: #161b22;
    }
    
    .media-list::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }
    
    .media-item {
      display: flex;
      align-items: center;
      padding: 10px;
      margin: 6px 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .media-item:hover {
      background: #21262d;
      border-color: #3fb950;
      transform: translateX(2px);
    }
    
    .media-icon {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #238636;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }
    
    .media-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    
    .media-icon.video {
      background: linear-gradient(135deg, #e34234 0%, #c026d3 100%);
    }
    
    .media-icon.audio {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    
    .media-icon.other {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    }
    
    .media-info {
      flex: 1;
      min-width: 0;
    }
    
    .media-title {
      font-size: 13px;
      font-weight: 500;
      color: #e6edf3;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .media-details {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #8b949e;
    }
    
    .media-size {
      color: #3fb950;
      font-weight: 500;
    }
    
    .media-type {
      background: #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
    }
    
    .media-action {
      margin-left: 8px;
    }
    
    .download-btn {
      background: #238636;
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .download-btn:hover {
      background: #2ea043;
      transform: scale(1.1);
    }
    
    .status {
      text-align: center;
      padding: 30px 20px;
      color: #8b949e;
      font-size: 13px;
    }
    
    .status-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    
    .footer {
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8b949e;
    }
    
    .footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Spider Logo" class="header-icon">
    <div class="header-text">
      <h1>Spider Manager</h1>
      <p>IDM-Level Download Manager</p>
    </div>
  </div>
  
  <div class="section">
    <div class="button-group">
      <button id="download-page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Page
      </button>
      <button id="refresh-media" class="secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>Detected Media</h2>
      <span class="section-count" id="media-count">0</span>
    </div>
    <div id="media-list" class="media-list">
      <div class="status">
        <div class="status-icon">🔍</div>
        <div>No media detected on this page</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <div class="footer-status">
      <div class="status-dot"></div>
      <span>Extension Active</span>
    </div>
    <span>v1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
