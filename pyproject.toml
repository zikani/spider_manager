[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spider-manager"
version = "1.0.0"
description = "Professional download manager built with Python and PyQt6"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spider Manager Team"}]
dependencies = [
    "PyQt6>=6.6.0",
    "qasync>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "yt-dlp>=2024.1.0",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "humanize>=4.9.0",
]

[project.scripts]
spider-manager = "main:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
